<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>TO-DO LIST</h1>
    <div class="container">
     <input id="task" placeholder="add task here">
     <button id="button1" onClick="addTask()">Add</button>
     <ul id="list"></ul>

     <div>
        <p>Total Tasks:<span id ="totalTasks">0</span></p>
        <p>Completed:<span id ="completedTasks">0</span></p>
        <p>Pending:<span id ="pendingTasks">0</span></p>
     </div>


     <!--for priority -->
    <select id="priority">
    <option value="High">High</option>
    <option value="Medium" selected>Medium</option>
    <option value="Low">Low</option>
    </select>

     <button onclick="filterTask('all')">All</button>
     <button onclick="filterTask('pending')">Pending</button>
     <button onclick="filterTask('completed')">Completed</button>

     <button onclick="clearCompleted()">Clear completed</button>
     <button onClick="deleteAll()">Delete All tasks</button>
    
     </div>
     <script src="script.js"></script>
</body>
</html>
